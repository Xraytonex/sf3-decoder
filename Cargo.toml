[workspace]
resolver = "2"
members = ["crates/opensf3", "crates/opensf3-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Xraytonex/sf3-decoder"
keywords = ["mass-spectrometry", "proteomics", "scaffold", "mzidentml", "mzml"]
categories = ["parser-implementations", "science"]

[workspace.dependencies]
opensf3 = { path = "crates/opensf3", version = "0.2.0" }
openmassspec-core = "3.0.0"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
